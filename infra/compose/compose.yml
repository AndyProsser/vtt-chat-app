# VTT Chat App — the primary deployment (Docker Compose on a VM or server).
# Start with ./setup.sh (generates .env and livekit.yaml), then:  docker compose pull && docker compose up -d --wait
# (to build from this checkout instead of pulling the published images:  docker compose up -d --build)
# Design and rationale: docs/architecture/DEPLOYMENT-AND-TRANSPORT.md
name: vtt
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: vtt
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vtt -d vtt']
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # LiveKit runs on the host network (below) and reaches Valkey through this loopback-only port.
    ports: ['127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 10

  # One-shot: the backend image runs as uid 1000 and a fresh named volume is root-owned.
  media-init:
    image: busybox:stable
    command: ['chown', '-R', '1000:1000', '/data/media']
    volumes: [media:/data/media]

  backend:
    # Pulled from the registry by default (`docker compose pull`); `docker compose up --build` builds it from
    # this checkout instead and tags it with the same name. VTT_VERSION is a release line (e.g. 0.3: newest
    # patch, never a new minor) or an exact version; setup.sh writes the line this checkout belongs to.
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-backend:${VTT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: backend
    restart: unless-stopped
    # Node as PID 1 ignores SIGTERM (the backend installs no handler), so every stop waited out Docker's 10 s grace
    # period and was then killed (found by the 2026-11-13 soak). A tiny init forwards the signal and Node exits at once.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    volumes: [media:/data/media]
    environment:
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      # Caddy reaches the backend over the Compose bridge network (a private address), so trust it for the
      # client's address; without this every player shares one rate-limit bucket and the device-approval page
      # shows Caddy's address. Safe: the backend port below is published on loopback only, never the LAN.
      TRUST_PROXY: 'loopback, uniquelocal'
      VALKEY_URL: redis://valkey:6379
      # Uploaded handouts and soundboard clips (type- and size-checked, served only to those allowed).
      MEDIA_DIR: /data/media
      # Optional outbound mail for emailed sign-in codes, and single sign-on. All off unless set in .env.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PUBLIC_URL: https://${SITE_ADDRESS}
      # Optional D&D Beyond character sync (off unless DDB_SYNC=1 in .env). Contacts dndbeyond.com.
      DDB_SYNC: ${DDB_SYNC:-}
      DDB_SYNC_HOURS: ${DDB_SYNC_HOURS:-}
      # Signed client updates (`vtt-admin updates publish`), served at /updates.
      UPDATES_DIR: /data/media/updates
      # Keeps that feed current without `updates publish`: the newest patch of this server's release line, from
      # GitHub releases. github = players download from GitHub; mirror = this server stores and serves the installers
      # (about 6 files, newest patch plus one previous); off = only what you publish by hand.
      UPDATES_SOURCE: ${UPDATES_SOURCE:-github}
      UPDATES_GITHUB_REPO: ${UPDATES_GITHUB_REPO:-}
      UPDATES_INCLUDE_DEV: ${UPDATES_INCLUDE_DEV:-}
      # Where the join page tells players to download the app (all optional; set in .env).
      CLIENT_URL_WINDOWS: ${CLIENT_URL_WINDOWS:-}
      CLIENT_URL_MACOS: ${CLIENT_URL_MACOS:-}
      CLIENT_URL_LINUX: ${CLIENT_URL_LINUX:-}
      LIVEKIT_URL: wss://${SITE_ADDRESS:?run ./setup.sh first}/livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Where `vtt-admin status` checks LiveKit from inside this container (the public URL above
      # points at Caddy, which a container cannot always reach through its own address).
      LIVEKIT_HEALTH_URL: http://host.docker.internal:7880
      # Audio capture: Egress (records profile) writes per-speaker files here; the worker reads them.
      RECORDINGS_DIR: /out
      # Seconds the DM may be disconnected before players can pause/resume/stop a recording, and before a
      # recording nobody is connected to stops by itself (5 to 3600, default 30).
      RECORDING_GRACE_SECONDS: ${RECORDING_GRACE_SECONDS:-}
      # Testing only: 1 also saves the DM's sound effects as a private, untranscribed file.
      RECORD_SOUNDBOARD: ${RECORD_SOUNDBOARD:-}
      RECORD_CUES: ${RECORD_CUES:-}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:${BACKEND_PORT:-3000}:3000'] # loopback only: health checks and local probes

  # Host networking is deliberate: a NATed UDP range of thousands of ports is slow to start and
  # breaks ICE candidate addresses. Config (keys, ports, external-IP) is in the generated livekit.yaml.
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.5}
    restart: unless-stopped
    network_mode: host
    command: ['--config', '/etc/livekit.yaml']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    depends_on:
      valkey: { condition: service_healthy }

  # --- Records pipeline (profile "records": docker compose --profile records up -d) ---
  # One-shot: the Egress image runs as uid 1001, a fresh named volume is root-owned.
  recordings-init:
    profiles: [records, records-remote]
    image: busybox:stable
    command: ['chown', '-R', '1001:0', '/out']
    volumes: [recordings:/out]

  # Per-speaker track egress writes files into /out. Host network like LiveKit: it talks to LiveKit
  # and Valkey on loopback. The image is large (~4 GB, it bundles Chrome for web egress we don't use).
  egress:
    profiles: [records, records-remote]
    image: livekit/egress:${EGRESS_VERSION:-v1.15.0}
    restart: unless-stopped
    network_mode: host
    # Config comes from the environment, not a file: the container runs as uid 1001 and a
    # mode-600 file written by setup.sh would be unreadable to it.
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${VALKEY_HOST_PORT:-6379}
        # Host-networked, so this binds on every interface: an uncommon port (not 8080, which a native
        # Whisper uses) and blocked from outside by the firewall (OPERATOR-GUIDE, ports).
        health_port: 18180
    volumes:
      - recordings:/out
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:18180/']
      interval: 15s
      retries: 5
    depends_on:
      recordings-init: { condition: service_completed_successfully }
      livekit: { condition: service_started }

  # --- Local AI: the default, and the fallback for a remote backend (profile "records"). A CPU without AVX (some old servers)
  # cannot run it; the profile "records-remote" runs recording and the worker only, and the AI runs on another machine. ---
  # Both speak the OpenAI-compatible API. Whisper runs on CPU here; for an NVIDIA GPU add the
  # compose.gpu.yml override (it builds whisper-cuda.Dockerfile, which also covers GTX 10-series cards).
  models-init:
    profiles: [records]
    image: curlimages/curl:latest
    user: root
    # Fetches the Whisper model once into a volume. WHISPER_MODEL_FILE is a ggml file name from
    # huggingface.co/ggerganov/whisper.cpp (small, quantised: ~190 MB, the measured CPU default).
    entrypoint:
      [
        'sh',
        '-c',
        'f=/models/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}; [ -s "$$f" ] || curl -fL -o "$$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}',
      ]
    volumes: [whisper-models:/models]

  whisper:
    profiles: [records]
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    entrypoint: ['/app/build/bin/whisper-server']
    command:
      - -m
      - /models/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --inference-path
      - /v1/audio/transcriptions
      - -l
      - en
    volumes: [whisper-models:/models:ro]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 15s
      retries: 10
    depends_on:
      models-init: { condition: service_completed_successfully }

  ollama:
    profiles: [records]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    environment:
      # Unload the model this long after the last request, so an idle server holds no (V)RAM for it.
      # A job's summaries run back to back, so the model stays loaded for the whole job.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      retries: 10

  # One-shot: pulls the summary model into the volume (first run downloads ~2 GB).
  ollama-pull:
    profiles: [records]
    image: ollama/ollama:latest
    entrypoint: ['sh', '-c', 'ollama pull ${OLLAMA_MODEL:-llama3.2:3b}']
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama: { condition: service_healthy }

  # Claims process-recording jobs, cuts tracks into speech windows (ffmpeg) and calls Whisper/the LLM
  # as the operator's AI settings say (vtt-admin settings), falling back to the local services above.
  worker:
    profiles: [records, records-remote]
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-worker:${VTT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      # Absent under the records-remote profile (the AI runs on another machine): required: false lets the worker start without them.
      whisper: { condition: service_healthy, required: false }
      ollama-pull: { condition: service_completed_successfully, required: false }
      recordings-init: { condition: service_completed_successfully }
    environment:
      # A stable name: after a restart this worker takes its own interrupted job back at once.
      WORKER_ID: worker-1
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      WHISPER_LOCAL_URL: http://whisper:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Delete raw audio this many days after a recording is processed (blank or 0: keep it).
      RECORDINGS_DIR: /out
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-}
      # 0 turns off the disk rule (warn the DM, then delete the oldest audio when the disk is below 10% free).
      AUDIO_DISK_PURGE: ${AUDIO_DISK_PURGE:-}
    volumes:
      # Writable so the worker can purge raw audio (retention or `vtt-admin recording purge`).
      - recordings:/out

  caddy:
    # Caddy with the Cloudflare DNS module (certificates through the DNS challenge need no inbound 80/443); same as the stock
    # caddy:2 otherwise. `docker compose up --build` builds it from caddy.Dockerfile.
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-caddy:${VTT_VERSION:-latest}
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ['80:80', '443:443', '443:443/udp']
    # LiveKit is on the host network; reach it by the host-gateway alias.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      CADDY_SITE: ${CADDY_SITE:-${SITE_ADDRESS}}
      # Only set when the site is behind Cloudflare's proxy (the installer does it): see Caddyfile.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      CLIENT_IP_HEADERS: ${CLIENT_IP_HEADERS:-X-Forwarded-For}
      # For the DNS challenge (--cloudflare-dns): a Cloudflare API token with Zone:DNS:Edit on your zone. A secret: it lives in .env.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls.d:/etc/caddy/tls.d:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional (profile "tunnel"): a Cloudflare Tunnel, for a server whose line blocks inbound 80/443 (most home connections) or
  # that should not expose them. Create the tunnel in Cloudflare (Zero Trust > Networks > Tunnels), give it a public hostname
  # for your domain with the service http://caddy:80, put its token in .env as CLOUDFLARE_TUNNEL_TOKEN, and set
  # CADDY_SITE=http://<your domain> and CLIENT_IP_HEADERS=CF-Connecting-IP. Voice does not use the tunnel (it is UDP, direct).
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]

volumes:
  media:
  recordings:
  whisper-models:
  ollama-data:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
