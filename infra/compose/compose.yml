# VTT Chat App — the primary deployment (Docker Compose on a VM or server).
# Start with ./setup.sh (generates .env and livekit.yaml), then:  docker compose up -d --build
# Design and rationale: docs/architecture/DEPLOYMENT-AND-TRANSPORT.md
name: vtt
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: vtt
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vtt -d vtt']
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # LiveKit runs on the host network (below) and reaches Valkey through this loopback-only port.
    ports: ['127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 10

  # One-shot: the backend image runs as uid 1000 and a fresh named volume is root-owned.
  media-init:
    image: busybox:stable
    command: ['chown', '-R', '1000:1000', '/data/media']
    volumes: [media:/data/media]

  backend:
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    volumes: [media:/data/media]
    environment:
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      VALKEY_URL: redis://valkey:6379
      # Uploaded handouts and soundboard clips (type- and size-checked, served only to those allowed).
      MEDIA_DIR: /data/media
      # Where the join page tells players to download the app (all optional; set in .env).
      CLIENT_URL_WINDOWS: ${CLIENT_URL_WINDOWS:-}
      CLIENT_URL_MACOS: ${CLIENT_URL_MACOS:-}
      CLIENT_URL_LINUX: ${CLIENT_URL_LINUX:-}
      LIVEKIT_URL: wss://${SITE_ADDRESS:?run ./setup.sh first}/livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Where `vtt-admin status` checks LiveKit from inside this container (the public URL above
      # points at Caddy, which a container cannot always reach through its own address).
      LIVEKIT_HEALTH_URL: http://host.docker.internal:7880
      # Audio capture: Egress (records profile) writes per-speaker files here; the worker reads them.
      RECORDINGS_DIR: /out
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:${BACKEND_PORT:-3000}:3000'] # loopback only: health checks and local probes

  # Host networking is deliberate: a NATed UDP range of thousands of ports is slow to start and
  # breaks ICE candidate addresses. Config (keys, ports, external-IP) is in the generated livekit.yaml.
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.5}
    restart: unless-stopped
    network_mode: host
    command: ['--config', '/etc/livekit.yaml']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    depends_on:
      valkey: { condition: service_healthy }

  # --- Records pipeline (profile "records": docker compose --profile records up -d) ---
  # One-shot: the Egress image runs as uid 1001, a fresh named volume is root-owned.
  recordings-init:
    profiles: [records]
    image: busybox:stable
    command: ['chown', '-R', '1001:0', '/out']
    volumes: [recordings:/out]

  # Per-speaker track egress writes files into /out. Host network like LiveKit: it talks to LiveKit
  # and Valkey on loopback. The image is large (~4 GB, it bundles Chrome for web egress we don't use).
  egress:
    profiles: [records]
    image: livekit/egress:${EGRESS_VERSION:-v1.15.0}
    restart: unless-stopped
    network_mode: host
    # Config comes from the environment, not a file: the container runs as uid 1001 and a
    # mode-600 file written by setup.sh would be unreadable to it.
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${VALKEY_HOST_PORT:-6379}
        health_port: 8080
    volumes:
      - recordings:/out
    depends_on:
      recordings-init: { condition: service_completed_successfully }
      livekit: { condition: service_started }

  # --- Local AI: always configured, the default and the fallback for a remote backend ---
  # Both speak the OpenAI-compatible API. Whisper runs on CPU here; for a GPU use a CUDA image
  # (see infra/records-smoke/whisper-cuda.Dockerfile) and the compose.gpu.yml override.
  models-init:
    profiles: [records]
    image: curlimages/curl:latest
    user: root
    # Fetches the Whisper model once into a volume. WHISPER_MODEL_FILE is a ggml file name from
    # huggingface.co/ggerganov/whisper.cpp (small, quantised: ~190 MB, the measured CPU default).
    entrypoint:
      [
        'sh',
        '-c',
        'f=/models/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}; [ -s "$$f" ] || curl -fL -o "$$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}',
      ]
    volumes: [whisper-models:/models]

  whisper:
    profiles: [records]
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    entrypoint: ['/app/build/bin/whisper-server']
    command:
      - -m
      - /models/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --inference-path
      - /v1/audio/transcriptions
      - -l
      - en
    volumes: [whisper-models:/models:ro]
    depends_on:
      models-init: { condition: service_completed_successfully }

  ollama:
    profiles: [records]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      retries: 10

  # One-shot: pulls the summary model into the volume (first run downloads ~2 GB).
  ollama-pull:
    profiles: [records]
    image: ollama/ollama:latest
    entrypoint: ['sh', '-c', 'ollama pull ${OLLAMA_MODEL:-llama3.2:3b}']
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama: { condition: service_healthy }

  # Claims process-recording jobs, cuts tracks into speech windows (ffmpeg) and calls Whisper/the LLM
  # as the operator's AI settings say (vtt-admin settings), falling back to the local services above.
  worker:
    profiles: [records]
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      whisper: { condition: service_started }
      ollama-pull: { condition: service_completed_successfully }
      recordings-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      WHISPER_LOCAL_URL: http://whisper:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - recordings:/out:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ['80:80', '443:443', '443:443/udp']
    # LiveKit is on the host network; reach it by the host-gateway alias.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  media:
  recordings:
  whisper-models:
  ollama-data:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
