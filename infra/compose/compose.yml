# VTT Chat App — the primary deployment (Docker Compose on a VM or server).
# Start with ./setup.sh (generates .env and livekit.yaml), then:  docker compose pull && docker compose up -d --wait
# (to build from this checkout instead of pulling the published images:  docker compose up -d --build)
# Design and rationale: docs/architecture/DEPLOYMENT-AND-TRANSPORT.md
name: vtt

# Health checks poll every 2 s while a container starts (so `up --wait` and depends_on stay quick) and once a minute
# after that. Every check is a process launched inside the container by Docker; at the old 5 to 15 s intervals those
# launches were nearly all of an idle server's CPU (measured 2026-11-16: about half a core on a 2010 Xeon, none of it
# our code; docs/architecture/DEPLOYMENT-AND-TRANSPORT.md). `start_interval` needs Docker Engine 25 or newer.
x-healthcheck: &healthcheck
  interval: 60s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

# Every container gives up what it does not need (2026-11-17): no Linux capabilities beyond the few a service adds
# back by name, and no gaining privileges through setuid programs. A bug in one service then has less to work with.
x-hardened: &hardened
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
# DAC_READ_SEARCH, where a service adds it, lets the container's root read the files mounted in from this folder even when
# they belong to your user and are private (livekit.yaml holds the API secret and is mode 600). Reading only: no writing.
# What an image needs when it starts as root, takes ownership of its data volume and then drops to its own user.
x-drops-to-user: &drops-to-user [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

# CPU priority (decided 2026-11-22, after the first full validation run): when the machine is short of CPU, live voice
# and recording come before processing. `cpu_shares` is a relative weight (default 1024) that only matters under
# contention: LiveKit, Egress and the backend 2048; the worker 512; Whisper and Ollama 256. Idle, it costs nothing.
# For a stronger guarantee turn on `vtt-admin settings set ai.pause-while-recording true`.
services:
  postgres:
    <<: *hardened
    cap_add: *drops-to-user
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: vtt
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U vtt -d vtt']

  valkey:
    <<: *hardened
    cap_add: *drops-to-user
    # An exact patch, not the floating `8`: 8.1.12 (2026-11-18) is a security release, and a floating tag only updates when
    # someone pulls. Moves to 9.1 with 0.7.0 (docs/architecture/DEPENDENCY-VERSIONS.md).
    image: valkey/valkey:8.1.12-alpine
    restart: unless-stopped
    # LiveKit runs on the host network (below) and reaches Valkey through this loopback-only port.
    ports: ['127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'valkey-cli', 'ping']

  backend:
    <<: *hardened
    cpu_shares: 2048
    # Pulled from the registry by default (`docker compose pull`); `docker compose up --build` builds it from
    # this checkout instead and tags it with the same name. VTT_VERSION is a release line (e.g. 0.3: newest
    # patch, never a new minor) or an exact version; setup.sh writes the line this checkout belongs to.
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-backend:${VTT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: backend
    restart: unless-stopped
    # Node as PID 1 ignores SIGTERM (the backend installs no handler), so every stop waited out Docker's 10 s grace
    # period and was then killed (found by the 2026-11-13 soak). A tiny init forwards the signal and Node exits at once.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    # The image runs as uid 1000 and owns /data/media, and Docker gives a new, empty named volume the ownership of the
    # image directory it is mounted on, so no start-up chown is needed (a bind mount instead must be writable by uid 1000).
    volumes: [media:/data/media]
    environment:
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      # Caddy reaches the backend over the Compose bridge network (a private address), so trust it for the
      # client's address; without this every player shares one rate-limit bucket and the device-approval page
      # shows Caddy's address. Safe: the backend port below is published on loopback only, never the LAN.
      TRUST_PROXY: 'loopback, uniquelocal'
      VALKEY_URL: redis://valkey:6379
      # Uploaded handouts and soundboard clips (type- and size-checked, served only to those allowed).
      MEDIA_DIR: /data/media
      # Optional outbound mail for emailed sign-in and reset links (needs PUBLIC_URL), and single sign-on. All off unless set in .env.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # PUBLIC_ORIGIN and LIVEKIT_PUBLIC_URL are set only for plain HTTP or a non-standard port (get.sh --http / --port).
      PUBLIC_URL: ${PUBLIC_ORIGIN:-https://${SITE_ADDRESS}}
      # Optional D&D Beyond character sync (off unless DDB_SYNC=1 in .env). Contacts dndbeyond.com.
      DDB_SYNC: ${DDB_SYNC:-}
      DDB_SYNC_HOURS: ${DDB_SYNC_HOURS:-}
      # Signed client updates (`vtt-admin updates publish`), served at /updates.
      UPDATES_DIR: /data/media/updates
      # Keeps that feed current without `updates publish`: the newest patch of this server's release line, from
      # GitHub releases. github = players download from GitHub; mirror = this server stores and serves the installers
      # (about 6 files, newest patch plus one previous); off = only what you publish by hand.
      UPDATES_SOURCE: ${UPDATES_SOURCE:-github}
      UPDATES_GITHUB_REPO: ${UPDATES_GITHUB_REPO:-}
      UPDATES_INCLUDE_DEV: ${UPDATES_INCLUDE_DEV:-}
      # `1`: a DM may delete a session of any length from the app (their app needs dev builds on too), and dev builds are offered.
      DEV_MODE: ${DEV_MODE:-}
      # Where the join page tells players to download the app (all optional; set in .env).
      CLIENT_URL_WINDOWS: ${CLIENT_URL_WINDOWS:-}
      CLIENT_URL_MACOS: ${CLIENT_URL_MACOS:-}
      CLIENT_URL_MACOS_INTEL: ${CLIENT_URL_MACOS_INTEL:-}
      CLIENT_URL_LINUX: ${CLIENT_URL_LINUX:-}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-wss://${SITE_ADDRESS:?run ./setup.sh first}/livekit}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Where `vtt-admin status` checks LiveKit from inside this container (the public URL above
      # points at Caddy, which a container cannot always reach through its own address).
      LIVEKIT_HEALTH_URL: http://host.docker.internal:7880
      # Audio capture: Egress (records profile) writes per-speaker files here; the worker reads them.
      RECORDINGS_DIR: /out
      # Seconds the DM may be disconnected before players can pause/resume/stop a recording, and before a
      # recording nobody is connected to stops by itself (5 to 3600, default 30).
      RECORDING_GRACE_SECONDS: ${RECORDING_GRACE_SECONDS:-}
      # Testing only: 1 also saves the DM's sound effects as a private, untranscribed file.
      RECORD_SOUNDBOARD: ${RECORD_SOUNDBOARD:-}
      STARTER_SOUNDS: ${STARTER_SOUNDS:-}
      # The largest single attachment to the Game Master's notes, in megabytes (default 100). A ceiling so one upload
      # cannot fill the disk; the product itself puts no limit on notes.
      GM_NOTES_MAX_MB: ${GM_NOTES_MAX_MB:-}
      RECORD_CUES: ${RECORD_CUES:-}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:${BACKEND_PORT:-3000}:3000'] # loopback only: health checks and local probes

  # Host networking is deliberate: a NATed UDP range of thousands of ports is slow to start and
  # breaks ICE candidate addresses. Config (keys, ports, external-IP) is in the generated livekit.yaml.
  livekit:
    <<: *hardened
    # Live voice and recording come first when the CPU is short (see the priority note under `services`).
    cpu_shares: 2048
    # NET_BIND_SERVICE only matters if you move a port (for example TURN) below 1024.
    cap_add: [DAC_READ_SEARCH, NET_BIND_SERVICE]
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.11}
    restart: unless-stopped
    network_mode: host
    command: ['--config', '/etc/livekit.yaml']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    depends_on:
      valkey: { condition: service_healthy }

  # --- Records pipeline (profile "records": docker compose --profile records up -d) ---
  # Per-speaker track egress writes files into /out. Host network like LiveKit: it talks to LiveKit
  # and Valkey on loopback. The image is large (~4 GB, it bundles Chrome for web egress we don't use).
  egress:
    <<: *hardened
    # Recording capture: as above.
    cpu_shares: 2048
    profiles: [records, records-remote]
    image: livekit/egress:${EGRESS_VERSION:-v1.15.0}
    restart: unless-stopped
    network_mode: host
    # Config comes from the environment, not a file: the container runs as uid 1001 and a
    # mode-600 file written by setup.sh would be unreadable to it.
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:${VALKEY_HOST_PORT:-6379}
        # Host-networked, so this binds on every interface: an uncommon port (not 8080, which a native
        # Whisper uses) and blocked from outside by the firewall (OPERATOR-GUIDE, ports).
        health_port: 18180
    volumes:
      - recordings:/out
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:18180/']
    depends_on:
      livekit: { condition: service_started }
      # Order matters for a new install: the Egress image runs as uid 1001 and has no /out of its own, so the recordings
      # volume must first be mounted by the worker, whose image owns /out as 1001 (Docker copies that onto an empty volume).
      worker: { condition: service_started }

  # --- Local AI: the default, and the fallback for a remote backend (profile "records"). A CPU without AVX (some old servers)
  # cannot run it; the profile "records-remote" runs recording and the worker only, and the AI runs on another machine. ---
  # Both speak the OpenAI-compatible API. Whisper runs on CPU here; for an NVIDIA GPU add the
  # compose.gpu.yml override (it builds whisper-cuda.Dockerfile, which also covers GTX 10-series cards).
  whisper:
    <<: *hardened
    # Background work: yields to voice and recording when the CPU is short.
    cpu_shares: 256
    cap_add: [DAC_READ_SEARCH]
    profiles: [records]
    # Upstream publishes only a moving `main` tag, so the default is the exact build this release was tested with
    # (2026-11-14). WHISPER_IMAGE in .env overrides it.
    image: ${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp@sha256:203ed2a39087406689e78ea5a664fef7ae596ee548f3323a4ffc63169da84933}
    restart: unless-stopped
    # whisper-start.sh fetches the model into the volume when it is missing (first start only: small.en, quantised, ~190 MB,
    # the measured CPU default; English only, so for another language set WHISPER_MODEL_FILE=ggml-small-q5_1.bin and
    # `vtt-admin settings` ai.transcription.language), then becomes whisper-server. The stack does not wait for the download: the worker holds
    # transcription until Whisper answers, and `vtt-admin status` and the status page say what is happening.
    entrypoint: ['sh', '/whisper-start.sh', 'run', '/app/build/bin/whisper-server']
    command:
      - -m
      - /models/${WHISPER_MODEL_FILE:-ggml-small.en-q5_1.bin}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --inference-path
      - /v1/audio/transcriptions
      - -l
      - en
    environment:
      # A ggml file name from huggingface.co/ggerganov/whisper.cpp.
      WHISPER_MODEL_FILE: ${WHISPER_MODEL_FILE:-ggml-small.en-q5_1.bin}
      # Threads for transcription; empty is every core (whisper-start.sh). Runs at low CPU priority either way.
      WHISPER_THREADS: ${WHISPER_THREADS:-}
    volumes:
      - whisper-models:/models
      - ./whisper-start.sh:/whisper-start.sh:ro
    healthcheck:
      <<: *healthcheck
      # Passes while the model is downloading (the container is doing its job); fails if a download attempt failed.
      test: ['CMD', 'sh', '/whisper-start.sh', 'health']

  ollama:
    <<: *hardened
    # Background work: as above.
    cpu_shares: 256
    profiles: [records]
    # A fixed version, the one this release was tested with: `latest` meant every update could bring a different Ollama.
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.17}
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    environment:
      # Unload the model this long after the last request, so an idle server holds no (V)RAM for it.
      # A job's summaries run back to back, so the model stays loaded for the whole job.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    healthcheck:
      <<: *healthcheck
      # A plain HTTP GET from bash. `ollama list` works too, but starting that large binary for every check cost more
      # CPU than anything else in an idle stack.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/11434 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3

  # Claims process-recording jobs, cuts tracks into speech windows (ffmpeg) and calls Whisper/the LLM
  # as the operator's AI settings say (vtt-admin settings), falling back to the local services above.
  # It also fetches the summary model into Ollama when it is missing (first start downloads ~3.3 GB, in the
  # background: only summaries wait for it), and reports that and Whisper's readiness to `vtt-admin status`.
  worker:
    <<: *hardened
    # Background work: as above.
    cpu_shares: 512
    profiles: [records, records-remote]
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-worker:${VTT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      # The backend creates and migrates the database schema as it starts; the worker needs the schema to be there.
      backend: { condition: service_healthy }
    environment:
      # A stable name: after a restart this worker takes its own interrupted job back at once.
      WORKER_ID: worker-1
      DATABASE_URL: postgres://vtt:${POSTGRES_PASSWORD}@postgres:5432/vtt
      WHISPER_LOCAL_URL: http://whisper:8080
      # The worker sizes Whisper's work to each clip for the models that cope with it (base and small); it goes by this name.
      WHISPER_MODEL_FILE: ${WHISPER_MODEL_FILE:-ggml-small.en-q5_1.bin}
      WHISPER_FIT_AUDIO_CTX: ${WHISPER_FIT_AUDIO_CTX:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      # Optional second model that tells the tales from the notes (blank: OLLAMA_MODEL takes the notes and tells the tales).
      OLLAMA_STORY_MODEL: ${OLLAMA_STORY_MODEL:-}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # The Claude connector (ai.llm.kind claude): billed per token at console.anthropic.com. Blank: Claude is not used.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The OpenAI connector (ai.llm.kind openai): billed per token at platform.openai.com. Blank: OpenAI is not used.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Delete raw audio this many days after a recording is processed (blank or 0: keep it).
      RECORDINGS_DIR: /out
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-}
      # 0 turns off the disk rule (warn the DM, then delete the oldest audio when the disk is below 10% free).
      AUDIO_DISK_PURGE: ${AUDIO_DISK_PURGE:-}
    volumes:
      # Writable so the worker can purge raw audio (retention or `vtt-admin recording purge`): the worker image runs as
      # uid 1001, the same user Egress writes the files as.
      - recordings:/out

  caddy:
    <<: *hardened
    cap_add: [DAC_READ_SEARCH, NET_BIND_SERVICE] # NET_BIND_SERVICE: ports 80 and 443
    # Caddy with the Cloudflare DNS module (certificates through the DNS challenge need no inbound 80/443); same as the stock
    # caddy:2 otherwise. `docker compose up --build` builds it from caddy.Dockerfile.
    image: ${VTT_REGISTRY:-ghcr.io/andyprosser}/vtt-chat-caddy:${VTT_VERSION:-latest}
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    # The defaults are the standard ports. `get.sh --http` / `--port` set these (see the operator guide).
    ports:
      [
        '${CADDY_HTTP_PORTS:-80:80}',
        '${CADDY_HTTPS_PORTS:-443:443}',
        '${CADDY_HTTPS_PORTS:-443:443}/udp',
      ]
    # LiveKit is on the host network; reach it by the host-gateway alias.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      CADDY_SITE: ${CADDY_SITE:-${SITE_ADDRESS}}
      # Only set when the site is behind Cloudflare's proxy (the installer does it): see Caddyfile.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      CLIENT_IP_HEADERS: ${CLIENT_IP_HEADERS:-X-Forwarded-For}
      # For the DNS challenge (--cloudflare-dns): a Cloudflare API token with Zone:DNS:Edit on your zone. A secret: it lives in .env.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls.d:/etc/caddy/tls.d:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional (profile "tunnel"): a Cloudflare Tunnel, for a server whose line blocks inbound 80/443 (most home connections) or
  # that should not expose them. Create the tunnel in Cloudflare (Zero Trust > Networks > Tunnels), give it a public hostname
  # for your domain with the service http://caddy:80, put its token in .env as CLOUDFLARE_TUNNEL_TOKEN, and set
  # CADDY_SITE=http://<your domain> and CLIENT_IP_HEADERS=CF-Connecting-IP. Voice does not use the tunnel (it is UDP, direct).
  cloudflared:
    <<: *hardened
    profiles: [tunnel]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.11.1}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]

volumes:
  media:
  recordings:
  whisper-models:
  ollama-data:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
