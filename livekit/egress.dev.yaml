# LiveKit Egress — DEVELOPMENT config for the Stage 2 smoke test.
# Run:  egress --config egress.dev.yaml
#
# Verified 2026-11-07 (Egress v1.15.0): these keys are enough for per-speaker track egress to a
# local directory. The Compose bundle (infra/compose, profile "records") passes the same keys. Track egress writes files to the Egress host's local
# disk when no cloud storage block is configured, which is exactly the self-host default.

log_level: info
api_key: devkey
api_secret: secret
ws_url: ws://127.0.0.1:7880
redis:
  address: 127.0.0.1:6379
health_port: 8080
