"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-app-commands"
description = "Allows local panel pages to invoke this app's own custom commands."
commands.allow = [
  "livekit_connect",
  "livekit_disconnect",
  "voice_connect",
  "voice_effect_set",
  "voice_effect_get",
  "hotkey_action",
  "set_microphone_muted",
  "panel_hydrate",
  "sync_command",
  "chat_send",
  "panel_open",
  "window_ready",
  "take_pending_server",
  "update_check",
  "update_install",
  "autostart_enabled",
  "autostart_set",
  "account_status",
  "account_sign_in",
  "account_select_campaign",
  "account_add_campaign",
  "account_sign_out",
  "recording_control",
  "campaign_api",
  "campaign_file",
  "handout_upload",
  "clipboard_picture",
]
