"$schema" = "./schemas/schema.json"

[[permission]]
identifier = "allow-app-commands"
description = "Allows local panel pages to invoke this app's own custom commands."
commands.allow = [
  "livekit_connect",
  "livekit_disconnect",
  "hotkey_action",
  "set_microphone_muted",
  "account_status",
  "account_sign_in",
  "account_select_campaign",
  "account_sign_out",
]
