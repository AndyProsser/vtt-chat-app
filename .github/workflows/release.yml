name: Release

# Builds the signed desktop installers for Windows, macOS and Linux and attaches them to a DRAFT
# GitHub release. Nothing reaches a player until an operator downloads the files and runs
# `vtt-admin updates publish` (docs/architecture/CLIENT-UPDATES.md): players update from their own
# server, never from GitHub.
#
# The tag's NAME decides the channel (tauri-client/scripts/release-channel.sh):
#   v0.4.0         a release. The version in tauri.conf.json and Cargo.toml must match the tag. Built into a
#                  DRAFT release: nothing is public until you review it and press Publish.
#   v0.4.0-dev.2   a dev build (-dev.N, -rc.N, -beta.N). The version comes from the tag (stamped at build
#                  time, no commit needed) and it is published at once as a GitHub PRE-release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater key's contents (REQUIRED: without it nothing can update)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password, if it has one
# Code signing for the OS itself (Windows Authenticode, Apple notarisation) is NOT set up: Windows
# SmartScreen and macOS Gatekeeper will warn on first run until it is. See docs/guides/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.3.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Check the version and open a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Work out the channel from the tag name
        id: channel
        run: echo "channel=$(tauri-client/scripts/release-channel.sh "$TAG")" >> "$GITHUB_OUTPUT"
      - name: A release's tag, tauri.conf.json and Cargo.toml must agree
        if: steps.channel.outputs.channel == 'release'
        run: tauri-client/scripts/release-version.sh "$TAG"
      - name: Create the GitHub release (a draft for a release, a pre-release for a dev build)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          if [ "$CHANNEL" = release ]; then
            # The notes are the CHANGELOG.md section for this version; no section, no release.
            tauri-client/scripts/changelog-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --generate-notes
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS (Apple silicon), os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Work out the channel from the tag name
        shell: bash
        run: |
          channel="$(tauri-client/scripts/release-channel.sh "$TAG")"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Stamp a dev build's version from its tag
        if: env.CHANNEL == 'dev'
        shell: bash
        run: tauri-client/scripts/stamp-version.sh "${TAG#v}"
      - name: Refuse to build without the updater key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set: installers would be unsigned and no app could update to them." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-client
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev patchelf
      # libwebrtc (the LiveKit client) is built against its own libc++, which needs clang 21 or later;
      # the runner image ships clang 18 and the build panics without this.
      - name: Install clang 21
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - run: npm ci
      # Builds shared first, then the panels the installer carries (frontendDist is panels-ui/dist).
      - run: npm run build
      - name: Build the signed installers
        working-directory: tauri-client
        shell: bash
        run: |
          # A dev build's version has a -dev.N label, which an MSI and an RPM cannot carry, so dev builds
          # skip those: Windows gets the NSIS installer, Linux the AppImage and .deb. Releases build everything.
          if [ "$CHANNEL" = dev ] && [ "$RUNNER_OS" = Windows ]; then
            npx tauri build --bundles nsis
          elif [ "$CHANNEL" = dev ] && [ "$RUNNER_OS" = Linux ]; then
            npx tauri build --bundles appimage deb
          else
            npx tauri build
          fi
      - name: Attach the installers and their signatures to the draft release
        shell: bash
        run: |
          set -euo pipefail
          cd tauri-client/target/release/bundle
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.msi' \
              -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) )
          [ "${#files[@]}" -gt 0 ] || { echo "the bundler produced nothing" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber
