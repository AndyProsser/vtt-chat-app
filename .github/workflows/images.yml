name: Images

# Builds the server images (backend and records worker) on every version tag and pushes them to GHCR, so an
# operator pulls a release instead of building it on the server.
#   Design: docs/architecture/VERSIONING-AND-DEPLOYMENT.md (section 3)
#
# The tag's NAME decides which image tags move (same rule as the desktop release, release-channel.sh):
#   v0.4.1         pushes :0.4.1 and :0.4 (the line) and :latest
#   v0.4.1-dev.2   pushes :0.4.1-dev.2 only. A dev build never moves :latest or the line tag.
# Images are linux/amd64 only for now (the target is a VM or homelab server).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.3.2'
        required: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vtt-chat-backend
            target: backend
          - image: vtt-chat-worker
            target: worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Work out the image tags from the tag name
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/${{ matrix.image }}"
          version="${TAG#v}"
          list="${repo}:${version}"
          if [ "$(tauri-client/scripts/release-channel.sh "$TAG")" = release ]; then
            line="${version%.*}"
            list="${list},${repo}:${line},${repo}:latest"
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/backend.Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VTT_VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
